# Checks only: no deploys and no secrets. Job names are referenced by branch protection on main,
# so rename them there too if they change.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24: scripts and the stdio entry rely on built-in TypeScript type stripping.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (PGlite)
        run: npm test
      - name: Smoke (Worker boots in workerd, no database)
        run: npm run smoke

  test-postgres:
    name: test-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same major and minor as the Neon project (18.6), pinned by digest.
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          # Throwaway CI container reachable only from this job, so no password is needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests (Postgres 18, per-test databases in a non-UTC session time zone)
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
